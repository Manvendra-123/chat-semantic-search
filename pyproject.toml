[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatsearch"
version = "1.0.0"
description = "Semantic search over a messy Hinglish group chat"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.4.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
chatsearch-corpus = "chatsearch.build_corpus:main"
chatsearch-eval = "chatsearch.eval:evaluate"
chatsearch-serve = "chatsearch.serve:main"
chatsearch-validate = "chatsearch.validate:main"

[tool.setuptools]
packages = ["chatsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
