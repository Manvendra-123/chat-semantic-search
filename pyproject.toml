[project]
name = "chatsearch"
version = "1.0.0"
description = "Semantic search over a messy Hinglish group chat"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.4.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
